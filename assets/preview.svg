<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" fill="none">
  <defs>
    <linearGradient id="sparkArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#26262E"/>
    </pattern>
  </defs>

  <!-- Outer Canvas -->
  <rect width="920" height="500" rx="16" fill="#0B0B0E"/>
  <rect x="0.5" y="0.5" width="919" height="499" rx="15.5" stroke="#26262E"/>

  <!-- Subtle Dot Matrix Backdrop -->
  <rect x="16" y="16" width="888" height="468" rx="12" fill="url(#dotGrid)" opacity="0.55"/>

  <!-- Host Browser Window Wireframe -->
  <rect x="34" y="32" width="852" height="436" rx="14" fill="#0D0D10" stroke="#26262E" stroke-width="1.2"/>

  <!-- Browser Top Bar (Monochrome circles, zero colored traffic lights) -->
  <rect x="35" y="33" width="850" height="42" rx="13" fill="#141418"/>
  <line x1="34" y1="75" x2="886" y2="75" stroke="#26262E" stroke-width="1"/>
  <circle cx="58" cy="54" r="5" fill="#0D0D10" stroke="#383842" stroke-width="1.2"/>
  <circle cx="76" cy="54" r="5" fill="#0D0D10" stroke="#383842" stroke-width="1.2"/>
  <circle cx="94" cy="54" r="5" fill="#0D0D10" stroke="#383842" stroke-width="1.2"/>

  <!-- Address Bar -->
  <rect x="124" y="42" width="430" height="24" rx="6" fill="#0D0D10" stroke="#26262E"/>
  <text x="138" y="58" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">localhost:3000/dashboard#/metrics</text>

  <!-- Extension Icon Badge in Toolbar -->
  <rect x="832" y="42" width="34" height="24" rx="6" fill="#0D0D10" stroke="#26262E"/>
  <polyline points="840,59 846,52 851,55 857,47 861,46" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Host Webpage Wireframe Content -->
  <g font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif">
    <rect x="62" y="102" width="142" height="22" rx="5" fill="#141418" stroke="#26262E"/>
    <text x="73" y="117" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">HOST WEBPAGE DOM</text>

    <text x="62" y="154" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="-0.4">Host App Dashboard</text>
    <text x="62" y="177" fill="#71717A" font-size="12.5">Global CSS rules stay trapped in light DOM.</text>
    <text x="62" y="195" fill="#71717A" font-size="12.5">Shadow root keeps widget buttons clean.</text>

    <!-- Host Wireframe Skeleton Blocks -->
    <rect x="62" y="218" width="390" height="96" rx="10" fill="#141418" stroke="#26262E"/>
    <text x="78" y="242" fill="#E4E4E7" font-size="11.5" font-weight="600">Host Page Global Stylesheet</text>
    <rect x="78" y="254" width="358" height="44" rx="6" fill="#0D0D10" stroke="#26262E"/>
    <text x="90" y="273" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">button { font-size: 32px !important; }</text>
    <text x="90" y="289" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">0% style leak into #shadow-root (open)</text>

    <!-- Host Wireframe Table / Bars -->
    <rect x="62" y="330" width="188" height="108" rx="10" fill="#141418" stroke="#26262E"/>
    <rect x="78" y="348" width="84" height="8" rx="4" fill="#26262E"/>
    <rect x="78" y="368" width="148" height="7" rx="3.5" fill="#1C1C22"/>
    <rect x="78" y="384" width="126" height="7" rx="3.5" fill="#1C1C22"/>
    <rect x="78" y="400" width="156" height="7" rx="3.5" fill="#1C1C22"/>
    <rect x="78" y="416" width="98" height="7" rx="3.5" fill="#1C1C22"/>

    <rect x="264" y="330" width="188" height="108" rx="10" fill="#141418" stroke="#26262E"/>
    <rect x="280" y="348" width="96" height="8" rx="4" fill="#26262E"/>
    <text x="280" y="379" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">window.FloatingWidget</text>
    <text x="280" y="397" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">.pushPoint(48.2)</text>
    <rect x="280" y="410" width="114" height="18" rx="4" fill="#0D0D10" stroke="#26262E"/>
    <text x="288" y="422" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">SPA route synced</text>
  </g>

  <!-- Shadow Boundary Callout Line -->
  <line x1="452" y1="266" x2="494" y2="266" stroke="#383842" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="494" cy="266" r="3" fill="#FFFFFF"/>

  <!-- ========================================================= -->
  <!-- OVERLAID DRAGGABLE SHADOW-DOM FLOATING WIDGET CARD        -->
  <!-- ========================================================= -->
  <g transform="translate(496, 56)" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif">
    <!-- Drop Shadow -->
    <rect x="6" y="10" width="364" height="398" rx="16" fill="#000000" opacity="0.55"/>

    <!-- Main Obsidian Widget Card (#141418 bg, #26262E border) -->
    <rect x="0" y="0" width="364" height="398" rx="16" fill="#141418" stroke="#26262E" stroke-width="1.4"/>

    <!-- 1. Drag Handle Header -->
    <rect x="12" y="12" width="340" height="42" rx="10" fill="#0D0D10" stroke="#26262E"/>
    <!-- 6-dot Drag Grip -->
    <g fill="#A1A1AA">
      <circle cx="25" cy="28" r="1.5"/>
      <circle cx="31" cy="28" r="1.5"/>
      <circle cx="25" cy="33" r="1.5"/>
      <circle cx="31" cy="33" r="1.5"/>
      <circle cx="25" cy="38" r="1.5"/>
      <circle cx="31" cy="38" r="1.5"/>
    </g>
    <text x="42" y="30" fill="#FFFFFF" font-size="12" font-weight="700">Floating Widget</text>
    <text x="42" y="44" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">localhost/dashboard#/metrics</text>

    <!-- Header Icon Buttons -->
    <rect x="266" y="21" width="24" height="24" rx="6" fill="#141418" stroke="#26262E"/>
    <line x1="273" y1="33" x2="283" y2="33" stroke="#E4E4E7" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="294" y="21" width="24" height="24" rx="6" fill="#141418" stroke="#26262E"/>
    <path d="M303 36L309 30M304 30H309V35" stroke="#E4E4E7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="322" y="21" width="24" height="24" rx="6" fill="#141418" stroke="#26262E"/>
    <path d="M330 29L338 37M338 29L330 37" stroke="#E4E4E7" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 2. Source & Tick Toolbar -->
    <g font-size="9.5" font-weight="600">
      <!-- Active Tab: Solid #FFFFFF bg + #000000 text -->
      <rect x="12" y="62" width="46" height="22" rx="6" fill="#FFFFFF"/>
      <text x="35" y="76" fill="#000000" text-anchor="middle" font-weight="700">Stream</text>

      <rect x="62" y="62" width="34" height="22" rx="6" fill="#141418" stroke="#26262E"/>
      <text x="79" y="76" fill="#E4E4E7" text-anchor="middle">FPS</text>

      <rect x="100" y="62" width="38" height="22" rx="6" fill="#141418" stroke="#26262E"/>
      <text x="119" y="76" fill="#E4E4E7" text-anchor="middle">Heap</text>

      <rect x="142" y="62" width="38" height="22" rx="6" fill="#141418" stroke="#26262E"/>
      <text x="161" y="76" fill="#E4E4E7" text-anchor="middle">DOM</text>

      <rect x="184" y="62" width="32" height="22" rx="6" fill="#141418" stroke="#26262E"/>
      <text x="200" y="76" fill="#E4E4E7" text-anchor="middle">Net</text>

      <!-- Cadence Group -->
      <rect x="248" y="62" width="28" height="22" rx="6" fill="#FFFFFF"/>
      <text x="262" y="76" fill="#000000" text-anchor="middle" font-weight="700">1s</text>

      <rect x="280" y="62" width="28" height="22" rx="6" fill="#141418" stroke="#26262E"/>
      <text x="294" y="76" fill="#E4E4E7" text-anchor="middle">5s</text>

      <rect x="312" y="62" width="40" height="22" rx="6" fill="#141418" stroke="#26262E"/>
      <text x="332" y="76" fill="#E4E4E7" text-anchor="middle">pause</text>
    </g>

    <!-- 3. Live SVG Sparkline & Stats Panel -->
    <rect x="12" y="92" width="340" height="148" rx="11" fill="#0D0D10" stroke="#26262E"/>
    <text x="24" y="118" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="-0.5">48.2</text>
    <text x="74" y="118" fill="#A1A1AA" font-size="11" font-weight="600">ms</text>
    <text x="340" y="117" fill="#A1A1AA" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">+4.6 ms | n=48</text>

    <!-- Dashed Gridlines -->
    <line x1="24" y1="136" x2="340" y2="136" stroke="#26262E" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="24" y1="160" x2="340" y2="160" stroke="#26262E" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="24" y1="184" x2="340" y2="184" stroke="#26262E" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Sparkline Area & Crisp White Stroke -->
    <path d="M24,176 L46,171 L68,174 L90,162 L112,166 L134,154 L156,159 L178,145 L200,151 L222,134 L244,142 L266,148 L288,131 L310,139 L336,129 L336,192 L24,192 Z" fill="url(#sparkArea)"/>
    <polyline points="24,176 46,171 68,174 90,162 112,166 134,154 156,159 178,145 200,151 222,134 244,142 266,148 288,131 310,139 336,129" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="336" cy="129" r="3.5" fill="#FFFFFF" stroke="#0D0D10" stroke-width="1.5"/>

    <!-- Stats Row Divider -->
    <line x1="22" y1="201" x2="342" y2="201" stroke="#26262E" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="24" y="214" fill="#71717A" font-size="8.5" font-weight="600">MIN</text>
      <text x="24" y="229" fill="#E4E4E7" font-size="11" font-weight="700">18.4</text>

      <text x="106" y="214" fill="#71717A" font-size="8.5" font-weight="600">AVG</text>
      <text x="106" y="229" fill="#E4E4E7" font-size="11" font-weight="700">34.1</text>

      <text x="188" y="214" fill="#71717A" font-size="8.5" font-weight="600">MAX</text>
      <text x="188" y="229" fill="#E4E4E7" font-size="11" font-weight="700">64.0</text>

      <text x="270" y="214" fill="#71717A" font-size="8.5" font-weight="600">P95</text>
      <text x="270" y="229" fill="#FFFFFF" font-size="11" font-weight="700">58.6</text>
    </g>

    <!-- 4. Per-Route Scratchpad Notes -->
    <rect x="12" y="248" width="340" height="72" rx="11" fill="#0D0D10" stroke="#26262E"/>
    <text x="22" y="265" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600">route scratchpad</text>

    <!-- Scope Pills -->
    <rect x="208" y="253" width="42" height="18" rx="5" fill="#FFFFFF"/>
    <text x="229" y="265" fill="#000000" text-anchor="middle" font-size="9" font-weight="700">Route</text>

    <rect x="254" y="253" width="46" height="18" rx="5" fill="#141418" stroke="#26262E"/>
    <text x="277" y="265" fill="#E4E4E7" text-anchor="middle" font-size="9" font-weight="600">Domain</text>

    <rect x="304" y="253" width="40" height="18" rx="5" fill="#141418" stroke="#26262E"/>
    <text x="324" y="265" fill="#E4E4E7" text-anchor="middle" font-size="9" font-weight="600">Global</text>

    <!-- Note Input Box -->
    <rect x="20" y="276" width="324" height="36" rx="6" fill="#141418" stroke="#26262E"/>
    <text x="28" y="292" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">check api spike on /metrics after login</text>
    <text x="28" y="305" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">compare p95 before and after cache patch</text>

    <!-- 5. Monochrome Quick-Action Command Grid -->
    <g font-size="10.5" font-weight="600">
      <rect x="12" y="328" width="110" height="24" rx="7" fill="#FFFFFF"/>
      <text x="67" y="344" fill="#000000" text-anchor="middle" font-weight="700">+ Point</text>

      <rect x="127" y="328" width="110" height="24" rx="7" fill="#141418" stroke="#26262E"/>
      <text x="182" y="344" fill="#E4E4E7" text-anchor="middle">Copy JSON</text>

      <rect x="242" y="328" width="110" height="24" rx="7" fill="#141418" stroke="#26262E"/>
      <text x="297" y="344" fill="#E4E4E7" text-anchor="middle">Snapshot</text>

      <rect x="12" y="357" width="110" height="24" rx="7" fill="#141418" stroke="#26262E"/>
      <text x="67" y="373" fill="#E4E4E7" text-anchor="middle">Clear</text>

      <rect x="127" y="357" width="110" height="24" rx="7" fill="#141418" stroke="#26262E"/>
      <text x="182" y="373" fill="#E4E4E7" text-anchor="middle">Minimize</text>

      <rect x="242" y="357" width="110" height="24" rx="7" fill="#141418" stroke="#26262E"/>
      <text x="297" y="373" fill="#E4E4E7" text-anchor="middle">Detach PiP</text>
    </g>

    <!-- Footer -->
    <text x="14" y="393" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600">Saved to localStorage</text>
    <text x="350" y="393" fill="#A1A1AA" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">Alt+Shift+W</text>
  </g>
</svg>
